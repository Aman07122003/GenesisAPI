<section
  class="card date-time-section"
  aria-label="Shipment Date and Time"
>
  <div class="panel-heading panel-heading--dark">
    <svg
      class="panel-heading__icon"
      viewBox="0 0 20 20"
      fill="none"
      aria-hidden="true"
    >
      <rect
        x="3"
        y="4.5"
        width="14"
        height="12"
        rx="1.6"
        stroke="currentColor"
        stroke-width="1.4"
      />

      <path
        d="M3 8H17"
        stroke="currentColor"
        stroke-width="1.4"
      />

      <path
        d="M6.5 2.5V5.5M13.5 2.5V5.5"
        stroke="currentColor"
        stroke-width="1.4"
        stroke-linecap="round"
      />
    </svg>

    <span>Schedule</span>
  </div>

  <div class="field-row">

    <div class="field">
      <label for="ship-date">
        Ship Date
      </label>

      <input
        type="date"
        id="ship-date"
        formControlName="scheduledShipDate"
        class="input"
        [min]="minDate"
        (change)="onDateChange()"
      >
    </div>

    <div class="field">
      <label for="ship-time">
        Ship Time
      </label>

      <input
        type="time"
        id="ship-time"
        formControlName="scheduledShipTime"
        class="input"
        [min]="minTime"
      >
    </div>

  </div>
</section>
