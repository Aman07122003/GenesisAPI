<div class="route-section">
  <div class="route-grid">

    <!-- Ship From -->
    <section class="card address-section" aria-labelledby="from-heading">
      <h2 id="from-heading" class="section-heading">
        <span class="section-badge">
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <circle cx="8" cy="8" r="6.4" stroke="currentColor" stroke-width="1.4"/>
            <circle cx="8" cy="8" r="2" fill="currentColor"/>
          </svg>
        </span>
        <span>From</span>
        <span class="section-heading__meta">Origin</span>
      </h2>

      <div class="field-group">
        <h3 class="field-group__title">Party</h3>
        <div class="field">
          <label for="from-attention">Attention</label>
          <input
            type="text"
            id="from-attention"
            formControlName="fromAttention"
            class="input"
            placeholder="Contact person's name"
          >
        </div>
        <div class="field">
          <label for="from-company">Company</label>
          <input
            type="text"
            id="from-company"
            formControlName="fromCompany"
            class="input"
            placeholder="Company name"
          >
        </div>
      </div>

      <div class="field-group">
        <h3 class="field-group__title">Address</h3>
        <div class="field">
          <label for="from-address1">Address Line 1</label>
          <input
            type="text"
            id="from-address1"
            formControlName="fromAddress1"
            class="input"
            placeholder="Street address"
          >
        </div>
      </div>

      <div class="field-group">
        <h3 class="field-group__title">Location</h3>
        <div class="field-row">
          <div class="field">
            <label for="from-city">City</label>
            <input
              type="text"
              id="from-city"
              formControlName="fromCity"
              class="input"
              placeholder="e.g. Toronto"
            >
          </div>
          <div class="field">
            <label for="from-province">Province</label>
            <select
              id="from-province"
              formControlName="fromProvince"
              class="input"
            >
              <option value="ON">ON — Ontario</option>
              <option value="BC">BC — British Columbia</option>
              <option value="AB">AB — Alberta</option>
              <option value="QC">QC — Quebec</option>
            </select>
          </div>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="from-postal">Postal Code</label>
            <input
              type="text"
              id="from-postal"
              formControlName="fromPostal"
              class="input"
              placeholder="e.g. M5V 3A8"
            >
          </div>
          <div class="field">
            <label for="from-country">Country</label>
            <select
              id="from-country"
              formControlName="fromCountry"
              class="input"
            >
              <option value="CA">CA — Canada</option>
              <option value="US">US — United States</option>
              <option value="MX">MX — Mexico</option>
            </select>
          </div>
        </div>
      </div>

      <div class="field-group">
        <h3 class="field-group__title">Contact</h3>
        <div class="field-row">
          <div class="field">
            <label for="from-phone">Phone</label>
            <input
              type="tel"
              id="from-phone"
              formControlName="fromPhone"
              class="input"
              placeholder="e.g. 416 555 0123"
            >
          </div>
          <div class="field">
            <label for="from-email">Email</label>
            <input
              type="email"
              id="from-email"
              formControlName="fromEmail"
              class="input"
              placeholder="e.g. shipping@company.com"
            >
          </div>
        </div>
      </div>
    </section>

    <!-- Route connector (decorative only) -->
    <div class="route-connector" aria-hidden="true">
      <span class="route-connector__node route-connector__node--start"></span>
      <span class="route-connector__line"></span>
      <span class="route-connector__glyph">
        <svg viewBox="0 0 20 20" fill="none">
          <path d="M2.5 13V6.5C2.5 6.22 2.72 6 3 6H11C11.28 6 11.5 6.22 11.5 6.5V13" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
          <path d="M11.5 8.5H14.8L17.5 11V13H11.5V8.5Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
          <circle cx="5.5" cy="13.5" r="1.3" stroke="currentColor" stroke-width="1.3"/>
          <circle cx="14.5" cy="13.5" r="1.3" stroke="currentColor" stroke-width="1.3"/>
        </svg>
      </span>
      <span class="route-connector__line"></span>
      <span class="route-connector__node route-connector__node--end"></span>
    </div>

    <!-- Ship To -->
    <section class="card address-section" aria-labelledby="to-heading">
      <h2 id="to-heading" class="section-heading">
        <span class="section-badge section-badge--accent">
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M8 14.5C8 14.5 13 10.2 13 6.6C13 3.9 10.76 1.83 8 1.83C5.24 1.83 3 3.9 3 6.6C3 10.2 8 14.5 8 14.5Z" stroke="currentColor" stroke-width="1.4"/>
            <circle cx="8" cy="6.5" r="1.7" stroke="currentColor" stroke-width="1.4"/>
          </svg>
        </span>
        <span>To</span>
        <span class="section-heading__meta">Destination</span>
      </h2>

      <div class="field-group">
        <h3 class="field-group__title">Party</h3>
        <div class="field">
          <label for="to-attention">Attention</label>
          <input
            type="text"
            id="to-attention"
            formControlName="toAttention"
            class="input"
            placeholder="Contact person's name"
          >
        </div>
        <div class="field">
          <label for="to-company">Company</label>
          <input
            type="text"
            id="to-company"
            formControlName="toCompany"
            class="input"
            placeholder="Company name"
          >
        </div>
      </div>

      <div class="field-group">
        <h3 class="field-group__title">Address</h3>
        <div class="field">
          <label for="to-address1">Address Line 1</label>
          <input
            type="text"
            id="to-address1"
            formControlName="toAddress1"
            class="input"
            placeholder="Street address"
          >
        </div>
      </div>

      <div class="field-group">
        <h3 class="field-group__title">Location</h3>
        <div class="field-row">
          <div class="field">
            <label for="to-city">City</label>
            <input
              type="text"
              id="to-city"
              formControlName="toCity"
              class="input"
              placeholder="e.g. Vancouver"
            >
          </div>
          <div class="field">
            <label for="to-province">Province</label>
            <select
              id="to-province"
              formControlName="toProvince"
              class="input"
            >
              <option value="ON">ON — Ontario</option>
              <option value="BC">BC — British Columbia</option>
              <option value="AB">AB — Alberta</option>
              <option value="QC">QC — Quebec</option>
            </select>
          </div>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="to-postal">Postal Code</label>
            <input
              type="text"
              id="to-postal"
              formControlName="toPostal"
              class="input"
              placeholder="e.g. V6B 1A1"
            >
          </div>
          <div class="field">
            <label for="to-country">Country</label>
            <select
              id="to-country"
              formControlName="toCountry"
              class="input"
            >
              <option value="CA">CA — Canada</option>
              <option value="US">US — United States</option>
              <option value="MX">MX — Mexico</option>
            </select>
          </div>
        </div>
      </div>

      <div class="field-group">
        <h3 class="field-group__title">Contact</h3>
        <div class="field-row">
          <div class="field">
            <label for="to-phone">Phone</label>
            <input
              type="tel"
              id="to-phone"
              formControlName="toPhone"
              class="input"
              placeholder="e.g. 604 555 0123"
            >
          </div>

          <div class="field">
            <label for="to-email">Email</label>
            <input
              type="email"
              id="to-email"
              formControlName="toEmail"
              class="input"
              placeholder="e.g. shipping@company.com"
            >
          </div>
        </div>
      </div>
    </section>

  </div>
</div>
