<div class="app-shell">
  <header class="topbar">
    <div class="topbar__brand">
      <span class="topbar__mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M3 7L12 3L21 7V17L12 21L3 17V7Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="M3 7L12 11L21 7" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="M12 11V21" stroke="currentColor" stroke-width="1.6"/>
        </svg>
      </span>
      <div class="topbar__title">
        <span class="topbar__eyebrow">Freight Console</span>
        <h1>Shipping Rate Request</h1>
      </div>
    </div>
    <div class="topbar__status" aria-hidden="true">
      <span class="status-dot"></span>
      <span>Rate engine connected</span>
    </div>
  </header>

  <main class="layout">

    <!-- Error Message -->
    <div *ngIf="errorMessage()" class="alert alert--error" role="alert">
      <svg class="alert__icon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
        <circle cx="10" cy="10" r="8" stroke="currentColor" stroke-width="1.4"/>
        <path d="M10 6.5V10.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        <circle cx="10" cy="13.25" r="0.9" fill="currentColor"/>
      </svg>
      <span>{{ errorMessage() }}</span>
    </div>

    <!-- Form: Date & Time + From / To + Packages -->
    <form [formGroup]="form" class="form-wrapper">

      <div class="workspace-label">
        <span class="workspace-label__eyebrow">Step 1</span>
        <span class="workspace-label__text">Shipment details</span>
      </div>

      <app-schedule></app-schedule>

      <div class="workspace-label">
        <span class="workspace-label__eyebrow">Step 2</span>
        <span class="workspace-label__text">Route</span>
      </div>

      <app-route></app-route>

      <!-- =====================================================
         STEP 3: PACKAGES
         ===================================================== -->

      <div class="workspace-label">
        <span class="workspace-label__eyebrow">Step 3</span>
        <span class="workspace-label__text">Packages</span>
      </div>

      <app-packages
        [packages]="packages"
        (addPackage)="addPackage()"
        (removePackage)="removePackage($event)">
      </app-packages>

    </form>

    <div class="workspace-label">
      <span class="workspace-label__eyebrow">Step 4</span>
      <span class="workspace-label__text">Available rates</span>
    </div>

    <!-- Quote Results Table -->
    <app-rates
      *ngIf="rates().length > 0"
      [rates]="rates()"
      [selectedRate]="selectedRate()"
      (rateSelect)="selectRate($event)">
    </app-rates>

    <!-- Action Buttons -->
    <app-actions
      [quoteLoading]="quoteLoading()"
      [quoteDisabled]="quoteLoading() || form.invalid"
      [shipmentLoading]="shipmentLoading()"
      [shipmentDisabled]="!shipmentEnabled() || form.invalid"
      (quote)="onQuote()"
      (shipment)="onShipment()">
    </app-actions>

  </main>

  <footer class="app-footer">
    <p>Freight Console — Shipping Rate Request</p>
  </footer>
</div>
