<div class="app-shell">
  <header class="topbar">
    <div class="topbar__brand">
      <span class="topbar__mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M3 7L12 3L21 7V17L12 21L3 17V7Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="M3 7L12 11L21 7" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="M12 11V21" stroke="currentColor" stroke-width="1.6"/>
        </svg>
      </span>
      <div class="topbar__title">
        <span class="topbar__eyebrow">Freight Console</span>
        <h1>Shipping Rate Request</h1>
      </div>
    </div>
  </header>

  <main class="layout">

    <!-- Error Message -->
    <div *ngIf="errorMessage()" class="alert alert--error" role="alert">
      {{ errorMessage() }}
    </div>

    <!-- Date & Time -->
    <section class="card date-time-section" aria-label="Shipment Date and Time">
      <div class="field-row">
        <div class="field">
          <label for="ship-date">Ship Date</label>
          <input type="date" id="ship-date" formControlName="scheduledShipDate" class="input">
        </div>
        <div class="field">
          <label for="ship-time">Ship Time</label>
          <input type="time" id="ship-time" formControlName="scheduledShipTime" class="input">
        </div>
      </div>
    </section>

    <!-- From / To -->
    <form [formGroup]="form" class="route-section">
      <div class="route-grid">

        <!-- Ship From -->
        <section class="card address-section" aria-labelledby="from-heading">
          <h2 id="from-heading" class="section-heading">From</h2>

          <div class="field">
            <label for="from-attention">Attention</label>
            <input type="text" id="from-attention" formControlName="fromAttention" class="input">
          </div>
          <div class="field">
            <label for="from-company">Company</label>
            <input type="text" id="from-company" formControlName="fromCompany" class="input">
          </div>
          <div class="field">
            <label for="from-address1">Address Line 1</label>
            <input type="text" id="from-address1" formControlName="fromAddress1" class="input">
          </div>
          <div class="field">
            <label for="from-address2">Address Line 2</label>
            <input type="text" id="from-address2" formControlName="fromAddress2" class="input" placeholder="Optional">
          </div>

          <div class="field-row">
            <div class="field">
              <label for="from-city">City</label>
              <input type="text" id="from-city" formControlName="fromCity" class="input">
            </div>
            <div class="field">
              <label for="from-province">Province</label>
              <select id="from-province" formControlName="fromProvince" class="input">
                <option value="ON">ON — Ontario</option>
                <option value="BC">BC — British Columbia</option>
                <option value="AB">AB — Alberta</option>
                <option value="QC">QC — Quebec</option>
              </select>
            </div>
          </div>

          <div class="field-row">
            <div class="field">
              <label for="from-postal">Postal Code</label>
              <input type="text" id="from-postal" formControlName="fromPostal" class="input">
            </div>
            <div class="field">
              <label for="from-country">Country</label>
              <select id="from-country" formControlName="fromCountry" class="input">
                <option value="CA">CA — Canada</option>
                <option value="US">US — United States</option>
                <option value="MX">MX — Mexico</option>
              </select>
            </div>
          </div>

          <div class="field-row">
            <div class="field">
              <label for="from-phone">Phone</label>
              <input type="tel" id="from-phone" formControlName="fromPhone" class="input">
            </div>
            <div class="field">
              <label for="from-email">Email</label>
              <input type="email" id="from-email" formControlName="fromEmail" class="input">
            </div>
          </div>
        </section>

        <!-- Ship To -->
        <section class="card address-section" aria-labelledby="to-heading">
          <h2 id="to-heading" class="section-heading">To</h2>

          <div class="field">
            <label for="to-attention">Attention</label>
            <input type="text" id="to-attention" formControlName="toAttention" class="input">
          </div>
          <div class="field">
            <label for="to-company">Company</label>
            <input type="text" id="to-company" formControlName="toCompany" class="input">
          </div>
          <div class="field">
            <label for="to-address1">Address Line 1</label>
            <input type="text" id="to-address1" formControlName="toAddress1" class="input">
          </div>
          <div class="field">
            <label for="to-address2">Address Line 2</label>
            <input type="text" id="to-address2" formControlName="toAddress2" class="input" placeholder="Optional">
          </div>

          <div class="field-row">
            <div class="field">
              <label for="to-city">City</label>
              <input type="text" id="to-city" formControlName="toCity" class="input">
            </div>
            <div class="field">
              <label for="to-province">Province</label>
              <select id="to-province" formControlName="toProvince" class="input">
                <option value="ON">ON — Ontario</option>
                <option value="BC">BC — British Columbia</option>
                <option value="AB">AB — Alberta</option>
                <option value="QC">QC — Quebec</option>
              </select>
            </div>
          </div>

          <div class="field-row">
            <div class="field">
              <label for="to-postal">Postal Code</label>
              <input type="text" id="to-postal" formControlName="toPostal" class="input">
            </div>
            <div class="field">
              <label for="to-country">Country</label>
              <select id="to-country" formControlName="toCountry" class="input">
                <option value="CA">CA — Canada</option>
                <option value="US">US — United States</option>
                <option value="MX">MX — Mexico</option>
              </select>
            </div>
          </div>

          <div class="field-row">
            <div class="field">
              <label for="to-phone">Phone</label>
              <input type="tel" id="to-phone" formControlName="toPhone" class="input">
            </div>
          </div>
        </section>

      </div>
    </form>

    <!-- Quote Results Table -->
    <section class="card results-section" *ngIf="rates().length > 0" aria-labelledby="results-heading">
      <h2 id="results-heading" class="section-heading">Quote Results</h2>

      <div class="table-wrap">
        <table class="rate-table">
          <thead>
            <tr>
              <th scope="col">Service Code</th>
              <th scope="col" class="num">Charge</th>
              <th scope="col" class="num">Fuel Surcharge</th>
              <th scope="col" class="num">Est. Transit Days</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let rate of rates()"
                (click)="selectRate(rate)"
                [class.selected]="selectedRate() === rate"
                class="rate-row">
              <td>{{ rate.serviceCode }}</td>
              <td class="num">${{ rate.charge.toFixed(2) }}</td>
              <td class="num">{{ rate.fuelSurchargePercent }}%</td>
              <td class="num">{{ rate.estTransitDays }} days</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

    <!-- Action Buttons -->
    <section class="card actions-section">
      <div class="button-group">
        <button
          type="button"
          (click)="onQuote()"
          [disabled]="quoteLoading() || form.invalid"
          class="btn btn--primary">
          <span *ngIf="!quoteLoading()">Get Quotes</span>
          <span *ngIf="quoteLoading()">Loading...</span>
        </button>

        <button
          type="button"
          (click)="onShipment()"
          [disabled]="!shipmentEnabled() || form.invalid"
          class="btn btn--secondary">
          <span *ngIf="!shipmentLoading()">Create Shipment</span>
          <span *ngIf="shipmentLoading()">Loading...</span>
        </button>
      </div>
    </section>

  </main>

  <footer class="app-footer">
    <p>Freight Console — Shipping Rate Request</p>
  </footer>
</div>
